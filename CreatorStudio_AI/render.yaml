services:
  - type: web
    name: creatorstudio-ai
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: creatorstudio-media
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: creatorstudio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: 2048
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
databases:
  - name: creatorstudio-db
    plan: basic-256mb
    databaseName: creatorstudio
    user: creatorstudio
